<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 FAQ 검색</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
        }
        .highlight {
            background-color: #fef08a;
            color: #854d0e;
            font-weight: 600;
            padding: 0.1rem 0.25rem;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-6 md:p-8">

<div class="max-w-3xl mx-auto mb-4">
    <!-- 상위 폴더/이전 디렉토리 이동 네비게이션 바 -->
    <nav class="flex items-center justify-between bg-white px-4 py-3 rounded-xl shadow-sm border border-slate-200">
        <a href="../" id="backLink" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-700 hover:text-blue-600 transition-colors duration-150 group">
            <span class="p-1.5 rounded-lg bg-slate-100 group-hover:bg-blue-50 group-hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </span>
            <span>MG금융계산기</span>
        </a>
        <span class="text-xs text-slate-600 font-medium hidden sm:inline-block">사내 업무지원 포털</span>
    </nav>
</div>

<main class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md border border-slate-200/80 p-6 sm:p-8">
    <header class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-50 text-blue-600 mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">업무 FAQ 검색</h1>
        <p class="text-slate-600 text-sm mt-1">궁금한 사내 업무 질문을 검색하거나 카테고리별로 찾아보세요.</p>
    </header>

    <!-- 검색창 컨트롤 -->
    <section class="mb-6" aria-label="FAQ 검색">
        <div class="flex flex-col sm:flex-row gap-2.5">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="질문이나 키워드를 입력하세요." 
                    class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                />
            </div>
            <div class="flex gap-2">
                <button 
                    id="searchBtn" 
                    type="button" 
                    class="flex-1 sm:flex-none px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition duration-150 shadow-sm shadow-blue-500/20 active:scale-[0.98]">
                    검색
                </button>
                <button 
                    id="resetBtn" 
                    type="button" 
                    class="flex-1 sm:flex-none px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition duration-150 active:scale-[0.98]">
                    전체보기
                </button>
            </div>
        </div>
    </section>

    <section class="mb-6" aria-label="카테고리 선택">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none" id="categoryContainer">
            <!-- 자바스크립트로 카테고리 칩 렌더링 -->
        </div>
    </section>

    <!-- 검색 결과 건수 표시 -->
    <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
        <div id="resultCount" class="text-sm font-medium text-slate-600">검색 결과: 총 0건</div>
    </div>

    <!-- FAQ 목록 영역 -->
    <section id="faqList" class="space-y-4" aria-label="FAQ 목록">
        <!-- 자바스크립트로 결과 목록 렌더링 -->
    </section>
</main>

<script>
    // FAQ초안_합성자료.json 데이터 (임의 생성 방지를 위해 엄격히 고정)
    const faqData = [
      {
        "category": "교육",
        "question": "교육 신청은 어디에서 하나요?",
        "answer_seed": "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        "category": "교육",
        "question": "신청한 교육을 취소하려면 어떻게 하나요?",
        "answer_seed": "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        "category": "문서",
        "question": "주간 업무보고에는 무엇을 넣어야 하나요?",
        "answer_seed": "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        "category": "IT",
        "question": "사내 시스템 접속이 되지 않습니다.",
        "answer_seed": "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        "category": "보안",
        "question": "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        "answer_seed": "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      }
    ];

    const categories = ["전체", "교육", "문서", "IT", "보안"];
    let currentCategory = "전체";
    let currentKeyword = "";

    // DOM 요소 캐싱
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const categoryContainer = document.getElementById('categoryContainer');
    const resultCount = document.getElementById('resultCount');
    const faqList = document.getElementById('faqList');

    // 카테고리 버튼 생성
    function renderCategories() {
        categoryContainer.innerHTML = categories.map(cat => {
            const isActive = cat === currentCategory;
            const activeClasses = isActive 
                ? "bg-blue-600 text-white shadow-sm shadow-blue-600/30" 
                : "bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800";
            return `
                <button 
                    type="button"
                    data-cat="${cat}"
                    class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors whitespace-nowrap ${activeClasses}">
                    ${cat}
                </button>
            `;
        }).join('');

        // 이벤트 위임
        categoryContainer.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.getAttribute('data-cat');
                renderCategories();
                renderResults();
            });
        });
    }

    // 키워드 하이라이트 함수 (HTML 특수문자 대응 및 이스케이프)
    function highlightText(text, keyword) {
        if (!keyword) return text;
        const safeKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${safeKeyword})`, 'gi');
        return text.replace(regex, '<mark class="highlight">$1</mark>');
    }

    // 결과 렌더링 함수
    function renderResults() {
        // 검색 필터링 로직
        const filtered = faqData.filter(item => {
            const matchesCat = currentCategory === "전체" || item.category === currentCategory;
            const matchesKeyword = item.question.includes(currentKeyword) || item.answer_seed.includes(currentKeyword);
            return matchesCat && matchesKeyword;
        });

        // 건수 표시
        resultCount.textContent = `검색 결과: 총 ${filtered.length}건`;

        // 결과 없음 상태 (엄격한 정적 안내문구 출력 - AI 허위 생성 방지)
        if (filtered.length === 0) {
            faqList.innerHTML = `
                <div class="p-8 text-center bg-slate-50 border border-dashed border-slate-300 rounded-xl">
                    <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-200 text-slate-500 mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <p class="text-slate-800 font-semibold mb-1">등록된 FAQ에서 답변을 찾을 수 없습니다.</p>
                    <p class="text-slate-500 text-sm">관련 담당부서 또는 공식 안내자료를 확인해 주세요.</p>
                </div>
            `;
            return;
        }

        // 결과 목록 출력
        faqList.innerHTML = filtered.map(item => `
            <article class="p-5 bg-slate-50 hover:bg-slate-50/80 border border-slate-200 rounded-xl transition-all duration-150">
                <div class="mb-2">
                    <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-md bg-blue-100 text-blue-800">
                        ${item.category}
                    </span>
                </div>
                <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-2 flex items-start gap-1.5">
                    <span class="text-blue-600 font-extrabold select-none">Q.</span>
                    <span>${highlightText(item.question, currentKeyword)}</span>
                </h2>
                <div class="text-sm sm:text-base text-slate-700 leading-relaxed flex items-start gap-1.5 bg-white p-3.5 rounded-lg border border-slate-200/70">
                    <span class="text-rose-500 font-bold select-none">A.</span>
                    <div>${highlightText(item.answer_seed, currentKeyword)}</div>
                </div>
            </article>
        `).join('');
    }

    // 검색 실행
    function executeSearch() {
        currentKeyword = searchInput.value.trim();
        renderResults();
    }

    // 전체보기 (초기화)
    function resetSearch() {
        searchInput.value = "";
        currentKeyword = "";
        currentCategory = "전체";
        renderCategories();
        renderResults();
    }

    // 이벤트 리스너 바인딩
    searchBtn.addEventListener('click', executeSearch);
    resetBtn.addEventListener('click', resetSearch);
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            executeSearch();
        }
    });

    // 앱 초기화
    renderCategories();
    renderResults();
</script>

</body>
</html>
