<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예금계좌 관리</title>
<style>
:root{--navy:#0b2942;--blue:#1769d2;--bg:#eef3f7;--line:#d9e3eb;--muted:#637587;--red:#cf3f45;--green:#168a63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182735;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;font-size:16px}.app{max-width:1450px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:20px}.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}h1{margin:0;color:var(--navy);font-size:clamp(1.6rem,3vw,2.25rem);letter-spacing:-.04em}.sub{margin:6px 0 0;color:var(--muted)}.status{background:#daf2e9;color:#107350;padding:8px 13px;border-radius:999px;font-size:.82rem;font-weight:800}.page-link{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 16px;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;font-size:.86rem;font-weight:800}.page-link:hover{background:#123d60}.page-link:focus-visible{outline:3px solid rgba(23,105,210,.22);outline-offset:2px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(15,42,66,.07)}.toolbar{display:flex;gap:10px;padding:16px;margin-bottom:15px}.toolbar input{flex:1;min-width:180px}.input,select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;color:#182735;font:inherit;outline:none}.input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,210,.12)}button{height:42px;border:0;border-radius:10px;padding:0 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e8eef3;color:#405466}.danger{background:#fee8e9;color:#b83238}.table-wrap{overflow:auto;border-radius:18px}table{width:100%;border-collapse:collapse;min-width:1000px}th{position:sticky;top:0;background:var(--navy);color:#fff;padding:13px 14px;text-align:left;font-size:.8rem;white-space:nowrap}td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:.84rem}tbody tr:hover{background:#f6f9fb}.num{text-align:right;font-variant-numeric:tabular-nums}.actions{display:flex;gap:7px}.actions button{height:34px;padding:0 11px;font-size:.76rem}.empty{text-align:center;padding:50px;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;width:min(620px,calc(100% - 28px));box-shadow:0 24px 70px rgba(0,0,0,.24)}dialog::backdrop{background:rgba(7,26,42,.55)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:1.15rem}.close{background:transparent;font-size:1.3rem;padding:0;width:38px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:22px}.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:.78rem;font-weight:750}.field .input,.field select{width:100%}.span2{grid-column:span 2}.modal-actions{display:flex;justify-content:flex-end;gap:9px;padding:0 22px 22px}.toast{position:fixed;right:22px;bottom:22px;max-width:420px;padding:13px 16px;border-radius:12px;background:var(--navy);color:#fff;box-shadow:0 12px 35px rgba(0,0,0,.22);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.warning{margin:0 0 15px;padding:12px 15px;border-radius:12px;background:#fff5db;color:#775200;font-size:.8rem;border:1px solid #f0d48d}@media(max-width:650px){.app{padding:18px 12px}header{display:block}.header-actions{justify-content:flex-start;margin-top:12px}.status{display:inline-block;margin-top:0}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}}
</style></head><body><main class="app"><header><div><h1>예금계좌 관리</h1><p class="sub">deposit_accounts · 조회, 추가, 수정, 삭제</p></div><div class="header-actions"><a class="page-link" href="dashboard.html">금리비교</a><div class="status" id="status">연결 중</div></div></header><p class="warning">공개 실습 모드입니다. 이 페이지를 가진 사람은 누구나 계좌 데이터를 변경할 수 있습니다.</p><section class="card toolbar"><input class="input" id="search" placeholder="계좌번호, 조합원번호, 계좌종류 검색" aria-label="계좌 검색"><button class="secondary" id="refresh">새로고침</button><button class="primary" id="add">계좌 추가</button></section><section class="card table-wrap"><table><thead><tr><th>계좌번호</th><th>조합원번호</th><th>지점번호</th><th>계좌종류</th><th>개설일</th><th style="text-align:right">잔액(원)</th><th style="text-align:right">금리(%)</th><th>관리</th></tr></thead><tbody id="body"><tr><td colspan="8" class="empty">데이터를 불러오는 중입니다.</td></tr></tbody></table></section></main>
<dialog id="editor"><form id="form"><div class="modal-head"><h2 id="formTitle">계좌 추가</h2><button class="close" type="button" id="close" aria-label="닫기">×</button></div><div class="form-grid"><div class="field"><label for="accountId">계좌번호</label><input class="input" id="accountId" type="number" min="1" required></div><div class="field"><label for="memberId">조합원번호</label><input class="input" id="memberId" type="number" min="1" required></div><div class="field"><label for="branchId">지점번호</label><input class="input" id="branchId" type="number" min="1" required></div><div class="field"><label for="accountType">계좌종류</label><input class="input" id="accountType" required placeholder="예: 정기예금"></div><div class="field"><label for="openDate">개설일</label><input class="input" id="openDate" type="date" required></div><div class="field"><label for="interestRate">금리(%)</label><input class="input" id="interestRate" type="number" min="0" step="0.01" required></div><div class="field span2"><label for="balance">잔액(원)</label><input class="input" id="balance" type="number" min="0" step="1" required></div></div><div class="modal-actions"><button class="secondary" type="button" id="cancel">취소</button><button class="primary" id="save" type="submit">저장</button></div></form></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const URL="https://tljavwvrdiamalwqegbe.supabase.co",KEY="sb_publishable_llsQvgglYrjtCLNT7egQ4A_PJxzN8LL",TABLE="deposit_accounts";let rows=[],editing=null;const $=s=>document.querySelector(s),headers={apikey:KEY,"Content-Type":"application/json"};
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2500)}function money(n){return Number(n).toLocaleString("ko-KR")}
async function request(path,options={}){const r=await fetch(`${URL}/rest/v1/${TABLE}${path}`,{...options,headers:{...headers,...options.headers}});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.message||`요청 실패 (${r.status})`)}return r.status===204?null:r.json()}
async function load(){try{$("#status").textContent="조회 중";rows=await request("?select=*&order=account_id.asc");$("#status").textContent=`연결됨 · ${rows.length}건`;render()}catch(e){$("#status").textContent="연결 오류";toast(e.message);$("#body").innerHTML=`<tr><td colspan="8" class="empty">${e.message}</td></tr>`}}
function render(){const q=$("#search").value.trim().toLowerCase(),data=rows.filter(r=>[r.account_id,r.member_id,r.account_type].some(v=>String(v).toLowerCase().includes(q)));$("#body").innerHTML=data.length?data.map(r=>`<tr><td><strong>${r.account_id}</strong></td><td>${r.member_id}</td><td>${r.branch_id}</td><td>${r.account_type}</td><td>${r.open_date}</td><td class="num">${money(r.balance)}</td><td class="num">${Number(r.interest_rate).toFixed(2)}</td><td><div class="actions"><button class="secondary" onclick="editRow(${r.account_id})">수정</button><button class="danger" onclick="deleteRow(${r.account_id})">삭제</button></div></td></tr>`).join(""):`<tr><td colspan="8" class="empty">조회 결과가 없습니다.</td></tr>`}
function openEditor(row=null){editing=row?.account_id??null;$("#formTitle").textContent=row?"계좌 수정":"계좌 추가";$("#accountId").disabled=!!row;$("#accountId").value=row?.account_id??"";$("#memberId").value=row?.member_id??"";$("#branchId").value=row?.branch_id??"";$("#accountType").value=row?.account_type??"";$("#openDate").value=row?.open_date??new Date().toISOString().slice(0,10);$("#balance").value=row?.balance??0;$("#interestRate").value=row?.interest_rate??0;$("#editor").showModal()}window.editRow=id=>openEditor(rows.find(r=>r.account_id===id));
window.deleteRow=async id=>{if(!confirm(`${id}번 계좌를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.`))return;try{await request(`?account_id=eq.${id}`,{method:"DELETE",headers:{Prefer:"return=minimal"}});toast("계좌를 삭제했습니다.");await load()}catch(e){toast(e.message)}};
$("#form").addEventListener("submit",async e=>{e.preventDefault();const payload={member_id:Number($("#memberId").value),branch_id:Number($("#branchId").value),account_type:$("#accountType").value.trim(),open_date:$("#openDate").value,balance:Number($("#balance").value),interest_rate:Number($("#interestRate").value)};if(editing===null)payload.account_id=Number($("#accountId").value);try{$("#save").disabled=true;if(editing===null)await request("",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});else await request(`?account_id=eq.${editing}`,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});$("#editor").close();toast(editing===null?"계좌를 추가했습니다.":"계좌를 수정했습니다.");await load()}catch(err){toast(err.message)}finally{$("#save").disabled=false}});
$("#search").addEventListener("input",render);$("#refresh").onclick=load;$("#add").onclick=()=>openEditor();$("#close").onclick=$("#cancel").onclick=()=>$("#editor").close();load();
</script></body></html>
